syntax = "proto3";

package camera;

// Shares the same generated Go package as the other protos in this directory.
option go_package = "crowd-backend-grpc/proto;hellopb";

import "google/api/annotations.proto";

// CameraStream is the canonical camera service — a gRPC port of the legacy
// FastAPI backend (routers/cameras.py + services/camera_manager.py).
//
// gRPC carries control-plane traffic (registry CRUD, WebRTC signalling,
// telemetry streaming). Encoded video flows peer-to-peer over WebRTC from the
// DeepStream pipeline; browsers reach these methods through the small REST
// translation layer in `server/rest.go`.
service CameraStream {
  // ── Registry (port of the legacy Mongo `cameras` collection CRUD) ──
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse) {
    option (google.api.http) = { get: "/api/v1/cameras" };
  }
  rpc GetCamera(GetCameraRequest) returns (Camera) {
    option (google.api.http) = { get: "/api/v1/cameras/{camera_id}" };
  }
  rpc RegisterCamera(RegisterCameraRequest) returns (Camera) {
    option (google.api.http) = { post: "/api/v1/cameras", body: "*" };
  }
  rpc UpdateCamera(UpdateCameraRequest) returns (Camera) {
    option (google.api.http) = { put: "/api/v1/cameras/{camera_id}", body: "*" };
  }
  rpc DeleteCamera(DeleteCameraRequest) returns (DeleteCameraResponse) {
    option (google.api.http) = { delete: "/api/v1/cameras/{camera_id}" };
  }

  // ── WebRTC signalling (non-trickle ICE, single round-trip) ──
  // ── WebRTC signalling (non-trickle ICE, single round-trip) ──
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse) {
    option (google.api.http) = { post: "/api/v1/webrtc/negotiate", body: "*" };
  }

  // ── Live telemetry (port of the legacy 1 Hz WebSocket /ws/camera/{id}) ──
  rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetrySample) {
    option (google.api.http) = { get: "/api/v1/telemetry/stream/{camera_id}" };
  }
}

// ModelManager ports the legacy /models endpoints. Packages are DeepStream
// bundles (nvinfer config + model + labels), not the old Python zips — see
// docs/MODEL_PACKAGE.md.
service ModelManager {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = { get: "/api/v1/models" };
  }
  
  // Unary base64 upload
  rpc UploadModel(UploadModelRequest) returns (ModelInfo) {
    option (google.api.http) = { post: "/api/v1/models/upload", body: "*" };
  }
  
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse) {
    option (google.api.http) = { delete: "/api/v1/models/{model_id}" };
  }
}

// ───────────────────────── Registry messages ─────────────────────────

message ListCamerasRequest {}

message Camera {
  string id = 1;
  string name = 2;
  string location = 3;
  bool online = 4;
  // Input URI fed to the DeepStream pipeline (rtsp://…, file://…, http://…).
  string source = 5;
  // Model package id used for inference on this camera ("" = passthrough).
  string model_id = 6;
  // Roles allowed to view this camera's feed/telemetry. Empty = all roles.
  repeated string allowed_roles = 7;
}

message ListCamerasResponse {
  repeated Camera cameras = 1;
}

message GetCameraRequest {
  string camera_id = 1;
}

message RegisterCameraRequest {
  string name = 1;
  string location = 2;
  string source = 3;
  string model_id = 4;
  repeated string allowed_roles = 5;
}

message UpdateCameraRequest {
  string camera_id = 1;
  string name = 2;
  string location = 3;
  string source = 4;
  string model_id = 5;
  repeated string allowed_roles = 6;
}

message DeleteCameraRequest {
  string camera_id = 1;
}

message DeleteCameraResponse {
  bool success = 1;
}

// ───────────────────────── Signalling messages ─────────────────────────

message NegotiateRequest {
  string camera_id = 1;
  // The browser's SDP offer (RTCSessionDescription.sdp).
  string sdp_offer = 2;
}

message NegotiateResponse {
  // The server's SDP answer (set as the browser's remote description).
  string sdp_answer = 1;
}

// ───────────────────────── Telemetry messages ─────────────────────────

message TelemetryRequest {
  string camera_id = 1;
}

message Metric {
  string label = 1;
  string value = 2;
  string unit = 3;
  string trend = 4; // "up" | "down" | "neutral"
  string color = 5; // "red" | "green" | "blue" | "default"
}

message TelemetrySample {
  string camera_id = 1;
  int32 count = 2;
  double latency_ms = 3;
  string model_id = 4;
  bool alert = 5;
  string alert_reason = 6;
  repeated Metric metrics = 7;
  double timestamp = 8; // unix seconds
}

// ───────────────────────── Model messages ─────────────────────────

message ListModelsRequest {}

message ModelInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  // Primary network file inside the package (relative path), e.g. model.onnx.
  string model_file = 4;
  // nvinfer configuration file (relative path), e.g. config_infer_primary.txt.
  string config_file = 5;
  string labels_file = 6;
  bool builtin = 7; // built-ins cannot be deleted
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message UploadModelMeta {
  string id = 1;
  string name = 2;
  string description = 3;
}

message UploadModelRequest {
  string name = 1;
  string description = 2;
  // A Base64-encoded zip file of the DeepStream package
  string package_base64 = 3;
}

message DeleteModelRequest {
  string model_id = 1;
}

message DeleteModelResponse {
  bool success = 1;
}

// ───────────────────────── IAM & Settings ─────────────────────────

service IAMService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/api/v1/iam/users" };
  }
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UserInfo) {
    option (google.api.http) = { put: "/api/v1/iam/users/{user_id}/role", body: "*" };
  }
  rpc RevokeAccess(RevokeAccessRequest) returns (RevokeAccessResponse) {
    option (google.api.http) = { delete: "/api/v1/iam/users/{user_id}/access" };
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = { delete: "/api/v1/iam/users/{user_id}" };
  }
}

service AnalyticsService {
  rpc GetGlobalStats(GetGlobalStatsRequest) returns (GlobalStatsResponse) {
    option (google.api.http) = { get: "/api/v1/analytics" };
  }
}

message UserInfo {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
}

message ListUsersRequest {}
message ListUsersResponse {
  repeated UserInfo users = 1;
}

message UpdateUserRoleRequest {
  string user_id = 1;
  string role = 2;
}

message RevokeAccessRequest {
  string user_id = 1;
}
message RevokeAccessResponse {
  bool success = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}
message DeleteUserResponse {
  bool success = 1;
}

message GetGlobalStatsRequest {}
message GlobalStatsResponse {
  int32 active_cameras = 1;
  int32 total_crowd_count = 2;
  double average_latency = 3;
  int32 active_alerts = 4;
}
